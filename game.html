<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Tic Tac Toe</title>



<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
transition:.3s;
}

body.light{
background:linear-gradient(135deg,#f8fafc,#cbd5e1);
}

.game{
width:100%;
max-width:650px;
padding:25px;
text-align:center;
}

.card{
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:25px;
border-radius:25px;
box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.light .card{
background:white;
}

h1{
color:white;
margin-bottom:15px;
}

.light h1{
color:#111;
}

.scoreboard{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.score{
padding:10px 18px;
background:rgba(255,255,255,.15);
border-radius:12px;
color:white;
font-weight:bold;
}

.light .score{
color:#111;
background:#e2e8f0;
}

.turn{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
color:#fff;
}

.light .turn{
color:#111;
}

.board-wrapper{
position:relative;
display:flex;
justify-content:center;
}

.board{
display:grid;
grid-template-columns:repeat(3,100px);
gap:10px;
}

.cell{
width:100px;
height:100px;
background:rgba(255,255,255,.1);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
font-weight:800;
cursor:pointer;
transition:.25s;
}

.cell:hover{
transform:scale(1.05);
background:rgba(255,255,255,.18);
}

.light .cell{
background:#e2e8f0;
}

.mark{
animation:pop .25s ease;
}

@keyframes pop{
from{
transform:scale(0);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.x{
color:#38bdf8;
text-shadow:0 0 15px #38bdf8;
}

.o{
color:#22c55e;
text-shadow:0 0 15px #22c55e;
}

.winner-cell{
background:rgba(255,255,255,.3);
}

#winnerLine{
position:absolute;
height:8px;
background:#ff3b30;
border-radius:999px;
display:none;
transform-origin:left center;
box-shadow:0 0 15px #ff3b30;
}

.controls{
margin-top:20px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.online-panel{
margin-top:18px;
padding:14px;
border:1px solid rgba(255,255,255,.2);
border-radius:14px;
text-align:left;
}

.online-panel h3{
color:white;
margin-bottom:10px;
}

.light .online-panel h3{
color:#111;
}

.online-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.online-actions input{
min-width:140px;
flex:1;
padding:12px;
border:0;
border-radius:12px;
text-transform:uppercase;
}

.online-status{
margin-top:10px;
color:white;
font-size:14px;
}

.light .online-status{
color:#111;
}

button{
border:none;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.primary{
background:#2563eb;
color:white;
}

.secondary{
background:#64748b;
color:white;
}

.danger{
background:#dc2626;
color:white;
}

.history{
margin-top:20px;
text-align:left;
max-height:180px;
overflow-y:auto;
color:white;
}

.light .history{
color:#111;
}

.history ul{
padding-left:20px;
}

.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.8);
z-index:999;
}

.modal-content{
background:white;
padding:35px;
border-radius:20px;
text-align:center;
animation:zoom .3s ease;
}

@keyframes zoom{
from{
transform:scale(.5);
}
to{
transform:scale(1);
}
}

.modal-content h2{
margin-bottom:20px;
}

@media(max-width:500px){

.board{
grid-template-columns:repeat(3,80px);
}

.cell{
width:80px;
height:80px;
font-size:48px;
}
}
</style>
</head>
<body>

<div class="game">

<div class="card">

<h1>🎮 Tic Tac Toe</h1>

<div class="scoreboard">
<div class="score">❌ P1: <span id="scoreX">0</span></div>
<div class="score">⭕ P2: <span id="scoreO">0</span></div>
<div class="score">🤝 Draw: <span id="scoreDraw">0</span></div>
</div>

<div class="turn" id="turnText">
Player 1 (X) Turn
</div>

<div class="board-wrapper">

<div id="winnerLine"></div>

<div class="board">

<div class="cell" data-index="0"></div>
<div class="cell" data-index="1"></div>
<div class="cell" data-index="2"></div>

<div class="cell" data-index="3"></div>
<div class="cell" data-index="4"></div>
<div class="cell" data-index="5"></div>

<div class="cell" data-index="6"></div>
<div class="cell" data-index="7"></div>
<div class="cell" data-index="8"></div>

</div>
</div>

<div class="online-panel">
<h3>🌐 Play With Another Person</h3>
<div class="online-actions">
<button class="primary" onclick="createOnlineGame()">Create Room</button>
<input id="roomCode" maxlength="6" placeholder="Room code">
<button class="secondary" onclick="joinOnlineGame()">Join Room</button>
</div>
<div class="online-status" id="onlineStatus">Local game with bot</div>
</div>

<div class="controls">
<button class="primary" onclick="resetGame()">🔄 New Game</button>
<button class="danger" onclick="resetEverything()">🗑 Reset All</button>
<button class="secondary" onclick="undoMove()">↩ Undo</button>
<button class="secondary" id="botToggle" onclick="toggleBot()">🤖 Bot: On</button>
<button class="secondary" onclick="toggleTheme()">🌙 Theme</button>
</div>

<div class="history">
<h3>📜 Move History</h3>
<ul id="historyList"></ul>
</div>

</div>
</div>

<div class="modal" id="winnerModal">
<div class="modal-content">
<h2 id="winnerText"></h2>
<button class="primary" onclick="closeModal()">Play Again</button>
</div>
</div>

<script>

const cells=document.querySelectorAll(".cell");
const turnText=document.getElementById("turnText");
const historyList=document.getElementById("historyList");
const winnerLine=document.getElementById("winnerLine");

let board=Array(9).fill("");
let currentPlayer="X";
let gameOver=false;
let history=[];
let botEnabled=true;
let botTimer=null;
let botTurnInProgress=false;
let onlineSocket=null;
let onlineMode=false;
let onlineMark="";

let scoreX=parseInt(localStorage.getItem("scoreX"))||0;
let scoreO=parseInt(localStorage.getItem("scoreO"))||0;
let scoreDraw=parseInt(localStorage.getItem("scoreDraw"))||0;

updateScores();

const wins=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

const lineMap={
"0,1,2":{left:0,top:50,width:320,rotate:0},
"3,4,5":{left:0,top:160,width:320,rotate:0},
"6,7,8":{left:0,top:270,width:320,rotate:0},
"0,3,6":{left:50,top:0,width:320,rotate:90},
"1,4,7":{left:160,top:0,width:320,rotate:90},
"2,5,8":{left:270,top:0,width:320,rotate:90},
"0,4,8":{left:10,top:10,width:420,rotate:45},
"2,4,6":{left:305,top:10,width:420,rotate:135}
};

cells.forEach(cell=>{
cell.addEventListener("click",play);
});

function play(){

if(gameOver) return;

if(onlineMode){
    if(currentPlayer !== onlineMark) return;
    const idx=Number(this.dataset.index);
    if(board[idx] || !onlineSocket || onlineSocket.readyState !== WebSocket.OPEN) return;
    onlineSocket.send(JSON.stringify({type:"move",index:idx}));
    return;
}

if(botEnabled && currentPlayer === "O" && !botTurnInProgress) return;

const idx=this.dataset.index;

if(board[idx]) return;

board[idx]=currentPlayer;

this.innerHTML = `<span class="mark ${currentPlayer.toLowerCase()}">${currentPlayer}</span>`;

history.push({
player:currentPlayer,
index:idx
});

const li=document.createElement("li");
li.textContent=`Player ${currentPlayer==="X"?"1":"2"} → Cell ${parseInt(idx)+1}`;
if(botEnabled && currentPlayer === "O"){
    li.textContent=`Computer → Cell ${parseInt(idx)+1}`;
}
historyList.appendChild(li);

checkWinner();

if(!gameOver){

currentPlayer=currentPlayer==="X"?"O":"X";

turnText.textContent=
currentPlayer==="X"
?"Player 1 (X) Turn"
:"Player 2 (O) Turn";

if(botEnabled && currentPlayer === "O"){
    turnText.textContent="Computer (O) Thinking...";
    botTimer=setTimeout(botMove,350);
}
}
}

function botMove(){

    botTimer=null;

    if(gameOver || !botEnabled || currentPlayer !== "O") return;

    const move=findWinningMove("O") ?? findWinningMove("X") ??
        (!board[4] ? 4 : [0,2,6,8].find(index => !board[index])) ??
        board.findIndex(value => !value);

    if(move !== -1){
        botTurnInProgress=true;
        cells[move].click();
        botTurnInProgress=false;
    }
}

function findWinningMove(player){

    for(const combo of wins){
        const values=combo.map(index => board[index]);
        if(values.filter(value => value === player).length === 2 && values.includes("")){
            return combo[values.indexOf("")];
        }
    }

    return null;
}

function checkWinner(){

for(let combo of wins){

const [a,b,c]=combo;

if(
board[a] &&
board[a]===board[b] &&
board[a]===board[c]
){

gameOver=true;

drawWinningLine(combo);

cells[a].classList.add("winner-cell");
cells[b].classList.add("winner-cell");
cells[c].classList.add("winner-cell");

            if(board[a] === "X"){
                scoreX++;
                showWinner("🏆 Player 1 Wins!");
            }
            else{
                scoreO++;
                showWinner("🏆 Player 2 Wins!");
            }

            saveScores();
            updateScores();
            celebrate();

            return true;
        }
    }

    if(!board.includes("")){

        gameOver = true;
        scoreDraw++;

        saveScores();
        updateScores();

        showWinner("🤝 Match Draw!");
        return true;
    }

    return false;
}

function drawWinningLine(pattern){

    winnerLine.style.display = "block";

    const map = {
        "0,1,2":"translate(15px,50px) rotate(0deg)",
        "3,4,5":"translate(15px,165px) rotate(0deg)",
        "6,7,8":"translate(15px,280px) rotate(0deg)",

        "0,3,6":"translate(50px,15px) rotate(90deg)",
        "1,4,7":"translate(165px,15px) rotate(90deg)",
        "2,5,8":"translate(280px,15px) rotate(90deg)",

        "0,4,8":"translate(15px,15px) rotate(45deg)",
        "2,4,6":"translate(315px,15px) rotate(135deg)"
    };

    winnerLine.style.width =
        (pattern[0] === 0 && pattern[2] === 8) ||
        (pattern[0] === 2 && pattern[2] === 6)
        ? "430px"
        : "300px";

    winnerLine.style.transform = map[pattern.join(",")];
}

function celebrate(){

    if(typeof confetti !== "function") return;

    confetti({
        particleCount: 200,
        spread: 120,
        origin: {
            y: 0.6
        }
    });
}

function showWinner(message){

    document.getElementById("winnerText").textContent = message;
    document.getElementById("winnerModal").style.display = "flex";
}

function closeModal(){

    document.getElementById("winnerModal").style.display = "none";
    resetGame();
}

function resetGame(){

    clearTimeout(botTimer);
    botTimer=null;

    if(onlineMode && onlineSocket && onlineSocket.readyState === WebSocket.OPEN){
        onlineSocket.send(JSON.stringify({type:"reset"}));
        return;
    }

    board = ["","","","","","","","",""];
    gameOver = false;
    currentPlayer = "X";

    history = [];

    historyList.innerHTML = "";

    cells.forEach(cell => {
        cell.innerHTML = "";
        cell.className = "cell";
    });

    winnerLine.style.display = "none";

    turnText.textContent = "Player 1 (X) Turn";
}

function resetEverything(){

    if(onlineMode && onlineSocket && onlineSocket.readyState === WebSocket.OPEN){
        onlineSocket.send(JSON.stringify({type:"reset"}));
        onlineSocket.close();
    }

    localStorage.clear();
    scoreX=0;
    scoreO=0;
    scoreDraw=0;
    onlineSocket=null;
    onlineMode=false;
    onlineMark="";
    botEnabled=true;
    document.getElementById("botToggle").textContent="🤖 Bot: On";
    document.getElementById("roomCode").value="";
    onlineStatus("Local game with bot");
    document.getElementById("winnerModal").style.display="none";
    updateScores();
    resetLocalBoard();
    turnText.textContent="Player 1 (X) Turn";
}

function undoMove(){

    if(history.length === 0 || gameOver) return;

    clearTimeout(botTimer);
    botTimer=null;

    if(botEnabled && history[history.length - 1].player === "O") removeLastMove();
    if(history.length === 0) return;

    removeLastMove();

    currentPlayer = "X";

    turnText.textContent = "Player 1 (X) Turn";
}

function removeLastMove(){

    const last = history.pop();

    board[last.index] = "";

    cells[last.index].innerHTML = "";
    cells[last.index].className = "cell";

    if(historyList.lastChild){
        historyList.removeChild(historyList.lastChild);
    }

}

function updateScores(){

    document.getElementById("scoreX").textContent = scoreX;
    document.getElementById("scoreO").textContent = scoreO;
    document.getElementById("scoreDraw").textContent = scoreDraw;
}

function saveScores(){

    localStorage.setItem("scoreX", scoreX);
    localStorage.setItem("scoreO", scoreO);
    localStorage.setItem("drawScore", scoreDraw);
}

function toggleTheme(){

    document.body.classList.toggle("light");
}

function toggleBot(){

    if(onlineMode) return;

    botEnabled=!botEnabled;
    document.getElementById("botToggle").textContent=`🤖 Bot: ${botEnabled?"On":"Off"}`;
    resetGame();
}

function connectOnline(){

    if(onlineSocket && onlineSocket.readyState === WebSocket.OPEN) return onlineSocket;

    if(location.protocol === "file:"){
        onlineStatus("Run npm start, then open http://localhost:3000");
        return {readyState: WebSocket.CLOSED};
    }

    const protocol=location.protocol === "https:" ? "wss" : "ws";
    onlineSocket=new WebSocket(`${protocol}://${location.host}`);

    onlineSocket.addEventListener("message", event => handleOnlineMessage(JSON.parse(event.data)));
    onlineSocket.addEventListener("close", () => {
        onlineStatus("Connection closed");
        onlineMode=false;
    });
    onlineSocket.addEventListener("error", () => onlineStatus("Could not connect to the game server"));
    return onlineSocket;
}

function createOnlineGame(){

    botEnabled=false;
    const socket=connectOnline();
    if(socket.readyState === WebSocket.CLOSED) return;
    const send=() => socket.send(JSON.stringify({type:"create"}));
    if(socket.readyState === WebSocket.OPEN) send();
    else socket.addEventListener("open", send, {once:true});
}

function joinOnlineGame(){

    const room=document.getElementById("roomCode").value.trim().toUpperCase();
    if(!room) return onlineStatus("Enter a room code first");

    botEnabled=false;
    const socket=connectOnline();
    if(socket.readyState === WebSocket.CLOSED) return;
    const send=() => socket.send(JSON.stringify({type:"join",room}));
    if(socket.readyState === WebSocket.OPEN) send();
    else socket.addEventListener("open", send, {once:true});
}

function handleOnlineMessage(message){

    if(message.type === "room"){
        onlineMode=true;
        onlineMark=message.mark;
        document.getElementById("roomCode").value=message.room;
        onlineStatus(`Room ${message.room}. You are ${message.mark}. Share this code.`);
        resetLocalBoard();
    }

    if(message.type === "waiting") onlineStatus(`Room ${message.room}. Waiting for the other player...`);
    if(message.type === "error") onlineStatus(message.message);
    if(message.type === "state") applyOnlineState(message);
}

function applyOnlineState(state){

    onlineMode=true;
    board=state.board;
    history=state.history;
    currentPlayer=state.turn;
    gameOver=state.gameOver;
    renderBoard();

    const winner=getWinningCombo();
    if(winner) drawWinningLine(winner);
    else winnerLine.style.display="none";

    if(state.gameOver){
        showWinner(state.winner ? `🏆 Player ${state.winner} Wins!` : "🤝 Match Draw!");
    } else {
        turnText.textContent=currentPlayer === onlineMark ? "Your Turn" : "Opponent's Turn";
    }
}

function renderBoard(){

    cells.forEach((cell,index) => {
        cell.innerHTML=board[index] ? `<span class="mark ${board[index].toLowerCase()}">${board[index]}</span>` : "";
        cell.className=board[index] ? "cell" : "cell";
    });
    historyList.innerHTML="";
    history.forEach(move => {
        const li=document.createElement("li");
        li.textContent=`Player ${move.player === "X" ? "1" : "2"} → Cell ${move.index + 1}`;
        historyList.appendChild(li);
    });
}

function resetLocalBoard(){

    clearTimeout(botTimer);
    board=Array(9).fill("");
    history=[];
    gameOver=false;
    winnerLine.style.display="none";
    renderBoard();
}

function getWinningCombo(){

    return wins.find(([a,b,c]) => board[a] && board[a] === board[b] && board[a] === board[c]) || null;
}

function onlineStatus(message){
    document.getElementById("onlineStatus").textContent=message;
}
</script>
